<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1119"><title>Onze — Uma carreira</title><style>
:root{--bg:#0b1119;--panel:#141e28;--line:#263541;--ink:#f1f5ed;--muted:#95a7ac;--lime:#c5f36a;--orange:#ff895c;--field:#246a4a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#1f3d33,transparent 60%),var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,Segoe UI,sans-serif}.app{max-width:520px;min-height:100dvh;margin:auto;padding:16px 16px 92px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.brand{font-size:12px;font-weight:1000;letter-spacing:.18em;color:var(--lime)}.season{font-size:10px;color:var(--muted);margin-top:3px}.badge{border:1px solid var(--line);background:#ffffff08;border-radius:99px;padding:7px 10px;font-size:10px;color:#dce7df}.card{background:linear-gradient(145deg,#18242c,#121a22);border:1px solid var(--line);border-radius:20px;padding:15px;margin:11px 0;box-shadow:0 12px 32px #0003}.hero{background:linear-gradient(130deg,#374d37,#203d34 62%,#15252a);min-height:155px;position:relative;overflow:hidden}.hero:after{content:'11';position:absolute;right:12px;bottom:-45px;font-size:158px;font-weight:1000;color:#ffffff08;line-height:1}.eyebrow{font-size:9px;letter-spacing:.16em;font-weight:900;color:var(--lime)}h1{font-size:29px;letter-spacing:-.04em;margin:7px 0 2px}.sub{color:#c2d0c4;font-size:12px}.hero-line{display:flex;justify-content:space-between;position:relative;z-index:1}.rating{text-align:center;border:1px solid #ffffff25;background:#10181799;border-radius:14px;padding:8px 12px}.rating b{display:block;font-size:23px;color:var(--lime)}.rating small{font-size:8px;letter-spacing:.1em}.chips{display:flex;gap:7px;margin-top:19px;position:relative;z-index:1}.chip{font-size:10px;background:#09120fa8;border:1px solid #ffffff18;border-radius:8px;padding:7px 9px}.chip strong{color:var(--lime)}.bars{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:12px 0}.bar{padding:11px;border:1px solid var(--line);background:#ffffff07;border-radius:14px}.bar-top{display:flex;justify-content:space-between;color:var(--muted);font-size:10px}.meter{height:5px;background:#ffffff18;border-radius:5px;margin-top:8px;overflow:hidden}.meter i{display:block;height:100%;background:var(--lime);border-radius:5px}.title{display:flex;justify-content:space-between;align-items:baseline;margin:17px 2px 9px}.title b{font-size:15px}.title small{color:var(--muted);font-size:10px}.fixture{display:flex;align-items:center;justify-content:space-between;text-align:center;padding:13px 0}.club{width:38%;font-size:11px;font-weight:800}.crest{height:42px;width:42px;margin:auto auto 6px;display:grid;place-items:center;background:linear-gradient(145deg,var(--lime),#80ad37);color:#17200f;font-weight:1000;clip-path:polygon(8% 0,92% 0,86% 72%,50% 100%,14% 72%)}.crest.away{background:linear-gradient(145deg,#70c7d0,#347d99);color:#fff}.versus{font-weight:900;color:#76888c;font-size:11px}.meta{border-top:1px solid var(--line);padding-top:10px;display:flex;justify-content:space-between;color:var(--muted);font-size:10px}.btn{border:0;border-radius:12px;background:var(--lime);color:#15200e;font-weight:950;padding:14px;width:100%;margin-top:11px;cursor:pointer;touch-action:manipulation}.btn:active{transform:translateY(1px)}.ghost{background:#ffffff08;border:1px solid var(--line);color:var(--ink)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.tile{padding:12px;border-radius:15px;background:#ffffff07;border:1px solid var(--line)}.tile b{font-size:12px}.tile p{font-size:10px;color:var(--muted);margin:4px 0 8px}.smallbtn{width:100%;border:1px solid #c5f36a55;border-radius:9px;padding:9px;background:#c5f36a0d;color:var(--lime);font-weight:900;font-size:10px}.table{width:100%;border-collapse:collapse;font-size:11px}.table td,.table th{padding:8px 5px;border-bottom:1px solid #ffffff10;text-align:right}.table td:first-child,.table th:first-child{text-align:left}.table th{color:var(--muted);font-size:9px;font-weight:700}.table .you{color:var(--lime);font-weight:900}.news{font-size:11px;color:#c6d2c9;line-height:1.5}.nav{position:fixed;z-index:3;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);display:flex;justify-content:space-around;background:#0b1119ee;backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:9px 5px max(12px,env(safe-area-inset-bottom))}.nav button{border:0;background:none;color:#829398;font-size:9px;display:grid;gap:3px;justify-items:center;min-width:55px}.nav button span{font-size:18px}.nav button.active{color:var(--lime)}.modal{position:fixed;inset:0;z-index:5;background:#03080bd9;display:grid;place-items:center;padding:15px;backdrop-filter:blur(5px)}.modal.hide{display:none}.dialog{max-width:470px;width:100%;max-height:94dvh;overflow:auto;background:#17222a;border:1px solid #ffffff25;border-radius:22px;padding:18px;box-shadow:0 20px 80px #000b}.dialog h2{margin:5px 0;font-size:24px}.dialog p{color:#bdc9c5;font-size:12px;line-height:1.5}.choices{display:grid;gap:8px;margin:11px 0}.choice{width:100%;text-align:left;border:1px solid #ffffff20;background:#ffffff08;border-radius:12px;color:var(--ink);padding:11px;cursor:pointer}.choice b{display:block;font-size:12px}.choice small{display:block;color:var(--muted);font-size:10px;margin-top:3px}.choice.selected{border-color:var(--lime);background:#c5f36a12}.row{display:flex;gap:8px}.row>*{flex:1}.field{position:relative;border:2px solid #ffffff28;border-radius:15px;overflow:hidden;background:#225f44;touch-action:none}canvas{display:block;width:100%;height:auto;touch-action:none}.control-hint{font-size:11px;text-align:center;color:#e2eddb;margin:9px 0}.msg{padding:10px;background:#0a1418;border:1px solid #ffffff15;border-radius:11px;color:#d9e7dc;font-size:12px;min-height:40px}.subtabs{display:flex;gap:7px}.tiny{font-size:10px;color:var(--muted)}.footer{text-align:center;color:#708187;font-size:9px;margin:18px 0}.hidden{display:none!important}select,input{background:#0b151b;border:1px solid #ffffff2a;color:white;border-radius:10px;padding:12px;font-size:15px;width:100%}.label{font-size:10px;color:#bfccca;margin:10px 0 5px}@media(min-width:700px){body{padding:18px 0}.app{border:1px solid #ffffff12;border-radius:22px;min-height:calc(100dvh - 36px)}.nav{bottom:18px;border-radius:0 0 22px 22px}}
</style></head><body><main class="app" id="app"></main><nav class="nav" id="nav"></nav><div class="modal hide" id="modal"><div class="dialog" id="dialog"></div></div><script>
(()=>{'use strict';const KEY='onze-realclub-preview-v2';const $=s=>document.querySelector(s);const app=$('#app'),nav=$('#nav'),modal=$('#modal'),dialog=$('#dialog');const countries=[{name:'Brasil',flag:'🇧🇷',league:'Série A 2026 · recorte demonstrativo de 8 clubes',source:'ESPN Brasil Série A 2026',clubs:['Flamengo','Palmeiras','Cruzeiro','Fluminense','Athletico Paranaense','Bahia','Atlético-MG','Red Bull Bragantino']},{name:'Portugal',flag:'🇵🇹',league:'Primeira Liga 2026–27 · recorte demonstrativo de 8 clubes',source:'ESPN Primeira Liga 2026–27',clubs:['FC Porto','Benfica','Sporting CP','Santa Clara','Arouca','Académico de Viseu','Gil Vicente','Braga']},{name:'Argentina',flag:'🇦🇷',league:'Liga Profesional 2026 · recorte demonstrativo de 8 clubes',source:'ESPN Liga Profesional Argentina 2026',clubs:['Instituto','Boca Juniors','Vélez Sarsfield','Defensa y Justicia','Lanús','Newell’s Old Boys','Gimnasia (Mendoza)','Independiente']}];const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let G=null,tab='Carreira',match=null,setup={country:0,club:0,pos:'Atacante'};function blank(name,country,club,pos){return{player:name,country,club,pos,league:country.league,source:country.source,season:1,round:1,energy:86,morale:64,shoot:52,pass:53,control:52,speed:54,goals:0,assists:0,apps:0,stars:0,offers:0,caps:0,callup:false,careerLog:['A jornada profissional começou.'],teams:countries[setup.country].clubs.slice(),table:[],playedIds:[],lastResult:null}}function initialTable(teams){return teams.map((name,i)=>({name,pts:0,p:0,w:0,d:0,l:0,gf:0,ga:0,gd:0,idx:i}))}function persist(){if(G)try{localStorage.setItem(KEY,JSON.stringify(G))}catch(e){}}function load(){try{let x=JSON.parse(localStorage.getItem(KEY));if(x&&x.player&&Array.isArray(x.teams)&&Array.isArray(x.table))return x}catch(e){}return null}G=load();function overall(){return Math.round((G.shoot+G.pass+G.control+G.speed)/4)}function club(){return G?G.teams[G.clubIndex||0]||G.club:G?.club||'—'}function escClub(s){return esc(s)}function record(msg){G.careerLog.unshift(msg);G.careerLog=G.careerLog.slice(0,10);persist()}function playerTeam(){return G.club}function nextOpponent(){let idx=(G.round+1)%G.teams.length;let opp=G.teams[idx];if(opp===G.club)opp=G.teams[(idx+1)%G.teams.length];return opp}function roundPairs(round){let list=G.teams.slice(),fixed=list.shift(),tail=list.slice();for(let n=1;n<round;n++)tail.unshift(tail.pop());list=[fixed,...tail];let pairs=[];for(let i=0;i<list.length/2;i++)pairs.push([list[i],list[list.length-1-i]]);return pairs}function upcoming(){if(G.round>7)return null;let pair=roundPairs(G.round).find(p=>p.includes(G.club));return pair?.find(n=>n!==G.club)||null}function sortedTable(){return [...G.table].sort((a,b)=>b.pts-a.pts||b.gd-a.gd||b.gf-a.gf||a.name.localeCompare(b.name))}function render(){if(!G){renderSetup();return}if(tab==='Partida'&&match){renderMatch();return}nav.innerHTML=['Carreira','Treino','Liga','Perfil'].map((t,i)=>`<button class="${tab===t?'active':''}" data-tab="${t}"><span>${['⌂','⚡','▤','◉'][i]}</span>${t.toUpperCase()}</button>`).join('');nav.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});let opponent=upcoming();let call=G.callup?'SELEÇÃO NACIONAL · CONVOCADO':`${G.country.name.toUpperCase()} · LIGA DEMONSTRATIVA · TEMPORADA ${G.season}`;app.innerHTML=`<header class="head"><div><div class="brand">ONZE <span style="color:#f3f5ef">/ UMA CARREIRA</span></div><div class="season">CARREIRA DE JOGADOR · PROTÓTIPO</div></div><span class="badge">${esc(G.country.flag)} TEMP. ${G.season} · R${G.round}</span></header><section class="card hero"><div class="hero-line"><div><div class="eyebrow">${esc(G.pos.toUpperCase())} · ${call}</div><h1>${esc(G.player)}</h1><div class="sub">${esc(G.club)} <span style="opacity:.5">·</span> ${esc(G.country.name)}</div></div><div class="rating"><b>${overall()}</b><small>GERAL</small></div></div><div class="chips"><span class="chip">⚡ Energia <strong>${G.energy}%</strong></span><span class="chip">✦ Moral <strong>${G.morale}</strong></span><span class="chip">⚽ Gols <strong>${G.goals}</strong></span></div></section><div class="bars"><div class="bar"><div class="bar-top"><span>Energia</span><b>${G.energy}%</b></div><div class="meter"><i style="width:${G.energy}%"></i></div></div><div class="bar"><div class="bar-top"><span>Temporada</span><b>${Math.min(G.round-1,7)}/7 jogos</b></div><div class="meter"><i style="width:${Math.min((G.round-1)/7*100,100)}%"></i></div></div></div><div class="title"><b>${G.round<=7?'PRÓXIMO JOGO':'FIM DA TEMPORADA'}</b><small>${G.round<=7?'RODADA '+G.round:'CARREIRA'}</small></div>${G.round<=7?`<section class="card"><div class="eyebrow">${esc(G.league||G.country.league)}</div><div class="fixture"><div class="club"><div class="crest">${crest(G.club)}</div>${esc(G.club)}<div class="tiny">VOCÊ · CASA</div></div><div class="versus">VS<br><span style="font-size:9px;color:#53666b">90′</span></div><div class="club"><div class="crest away">${crest(opponent)}</div>${esc(opponent)}<div class="tiny">FORA</div></div></div><div class="meta"><span>◷ Rodada ${G.round} · campeonato demonstrativo</span><span>titular</span></div><button class="btn" id="startMatch">IR PARA A PARTIDA →</button></section>`:`<section class="card"><div class="eyebrow">TEMPORADA CONCLUÍDA</div><p class="news">${seasonSummary()}</p><div class="tile"><b>📨 Proposta de transferência</b><p id="offerText">${G.offerDecided?(G.transferAccepted?`Você aceitou a proposta do ${esc(G.pendingClub)}; a transferência ocorre no início da próxima temporada.`:`Você recusou a proposta e permanece no ${esc(G.club)}.`):`${esc(G.pendingClub)} oferece uma vaga para a próxima temporada.`}</p>${G.offerDecided?'':`<div class="row"><button class="smallbtn" id="acceptTransfer">ACEITAR</button><button class="smallbtn" id="rejectTransfer">RECUSAR</button></div>`}</div><button class="btn" id="newSeason">COMEÇAR PRÓXIMA TEMPORADA</button></section>`}<div class="title"><b>VIDA DE JOGADOR</b><small>CAMPO E EVOLUÇÃO</small></div><section class="grid2"><div class="tile"><b>🏋️ Sessão de treino</b><p>Escolha um atributo para evoluir.</p><button class="smallbtn" id="goTrain">TREINAR AGORA</button></div><div class="tile"><b>🛌 Recuperação</b><p>Reponha energia para a partida.</p><button class="smallbtn" id="rest">DESCANSAR +32</button></div><div class="tile"><b>🧑‍💼 Seu agente</b><p>${G.apps>=3?'Há olheiros de clubes acompanhando seu desempenho.':'Construa seu histórico para atrair propostas.'}</p><button class="smallbtn" id="agent">${G.offers?'VER PROPOSTA':'FALAR COM AGENTE'}</button></div></section><div class="title"><b>ÚLTIMA NOTÍCIA</b><small>CARREIRA</small></div><section class="card news">${esc(G.careerLog[0]||'A sua história está só começando.')}</section><div class="footer">Clubes reais em uma liga demonstrativa de 8 times; resultados e calendário são simulados, não são a competição oficial nem uma tabela/fixture oficial. Sem licença oficial, escudos ou uniformes de clube. Fonte da lista: ${esc(G.source||G.country.source)}. Salvamento independente neste navegador (${KEY}); carreira original não alterada.</div>`;$('#startMatch')?.addEventListener('click',startMatch);$('#goTrain')?.addEventListener('click',trainingMenu);$('#rest')?.addEventListener('click',rest);$('#newSeason')?.addEventListener('click',newSeason)}function crest(n){return esc(n.split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase())}function seasonSummary(){let row=G.table.find(t=>t.name===G.club);let rank=sortedTable().findIndex(t=>t.name===G.club)+1;return `Você terminou a temporada em ${rank}º lugar, com ${row?.pts||0} pontos; marcou ${G.goals} gol${G.goals===1?'':'s'} e deu ${G.assists} assistência${G.assists===1?'':'s'}. A campanha segue para uma nova temporada.`}function renderSetup(){nav.innerHTML='';app.innerHTML=`<header class="head"><div><div class="brand">ONZE <span style="color:#f3f5ef">/ UMA CARREIRA</span></div><div class="season">O CAMINHO DE UM JOGADOR COMEÇA AQUI</div></div><span class="badge">NOVO JOGO</span></header><section class="card hero"><div class="eyebrow">DO PRIMEIRO CONTRATO À SELEÇÃO</div><h1>O campo é seu.</h1><div class="sub">Crie um jogador, construa a carreira e conquiste espaço lance a lance.</div><div class="chips"><span class="chip">⚽ Ações no campo</span><span class="chip">🏆 Liga e temporada</span></div></section><section class="card"><div class="eyebrow">CRIAR JOGADOR</div><label class="label" for="pname">Nome</label><input id="pname" maxlength="18" placeholder="Seu nome de jogador" value="Mateus"><div class="label">País</div><div class="choices" id="countries">${countries.map((c,i)=>`<button class="choice ${i===setup.country?'selected':''}" data-country="${i}"><b>${c.flag} ${c.name}</b><small>${esc(c.league)} · clubes reais</small></button>`).join('')}</div><div class="label">Clube inicial · seleção de clubes reais (liga demonstrativa)</div><div class="choices" id="clubs"></div><div class="label">Posição</div><div class="row"><button class="choice ${setup.pos==='Atacante'?'selected':''}" data-pos="Atacante"><b>⚡ Atacante</b><small>Finalização e velocidade</small></button><button class="choice ${setup.pos==='Meia'?'selected':''}" data-pos="Meia"><b>🎯 Meia</b><small>Passe e controle</small></button></div><button class="btn" id="create">COMEÇAR MINHA CARREIRA →</button></section><section class="card"><div class="eyebrow">O QUE TEM NO PROTÓTIPO</div><p class="news">Temporadas de sete rodadas, tabela com pontos por resultado (3/1/0), treino e descanso, partidas com quatro lances interativos, evolução e convite demonstrativo de transferência ao fim da temporada.</p></section><div class="footer">Prévia independente: clubes reais para seleção, mas competição de 8 clubes e resultados simulados — não representa calendário ou campeonato oficial completo. Sem licença oficial; não usa escudos nem uniformes dos clubes. Listas verificadas em fontes esportivas; veja a fonte indicada após iniciar a carreira. Outros países serão ampliados conforme verificação.</div>`;function clubs(){let c=countries[setup.country];if(setup.club>=c.clubs.length)setup.club=0;$('#clubs').innerHTML=c.clubs.map((n,i)=>`<button class="choice ${i===setup.club?'selected':''}" data-club="${i}"><b>${esc(n)}</b><small>Clube real · lista demonstrativa</small></button>`).join('');$('#clubs').querySelectorAll('[data-club]').forEach(b=>b.onclick=()=>{setup.club=+b.dataset.club;clubs()})}clubs();$('#countries').querySelectorAll('[data-country]').forEach(b=>b.onclick=()=>{setup.country=+b.dataset.country;setup.club=0;$('#countries').querySelectorAll('.choice').forEach(x=>x.classList.toggle('selected',x===b));clubs()});app.querySelectorAll('[data-pos]').forEach(b=>b.onclick=()=>{setup.pos=b.dataset.pos;app.querySelectorAll('[data-pos]').forEach(x=>x.classList.toggle('selected',x===b))});$('#create').onclick=()=>{let name=$('#pname').value.trim().slice(0,18)||'Craque';let c=countries[setup.country];G=blank(name,c,c.clubs[setup.club],setup.pos);G.clubIndex=setup.club;G.table=initialTable(G.teams);record(`${name} assinou o primeiro contrato com ${G.club}. Começa a temporada de sete rodadas.`);tab='Carreira';render()}}function open(title,html,onReady){dialog.innerHTML=`<div class="eyebrow">ONZE · SUA CARREIRA</div><h2>${title}</h2>${html}`;modal.classList.remove('hide');if(onReady)onReady()}function close(){modal.classList.add('hide')}modal.onclick=e=>{if(e.target===modal)close()};function trainingMenu(){let opts=[['shoot','Finalização','Aumenta a precisão dos chutes'],['pass','Passe','Melhora a qualidade do passe'],['control','Controle','Mais domínio nos lances'],['speed','Velocidade','Ritmo para chegar às chances']];open('Treino da semana',`<p>Treinar custa 18 de energia. Um bom desempenho nos jogos também melhora seus atributos.</p><div class="choices">${opts.map(x=>`<button class="choice" data-train="${x[0]}"><b>🏋️ ${x[1]} · ${G[x[0]]}</b><small>${x[2]}</small></button>`).join('')}</div><button class="btn ghost" id="cancel">VOLTAR</button>`,()=>{$('#cancel').onclick=close;dialog.querySelectorAll('[data-train]').forEach(b=>b.onclick=()=>train(b.dataset.train))})}function train(key){if(G.energy<18){open('Energia baixa','<p>Você precisa de pelo menos 18 de energia para treinar.</p><button class="btn" id="ok">ENTENDI</button>',()=>$('#ok').onclick=close);return}G[key]=Math.min(90,G[key]+2);G.energy-=18;G.morale=Math.min(99,G.morale+1);record(`Treino concluído: ${({shoot:'finalização',pass:'passe',control:'controle',speed:'velocidade'})[key]} +2.`);persist();close();render()}function rest(){G.energy=Math.min(100,G.energy+32);G.morale=Math.min(99,G.morale+2);record('Descanso concluído: energia recuperada.');persist();render()}function startMatch(){if(G.energy<10){open('Você está sem energia','<p>Descanse antes de entrar em campo.</p><button class="btn" id="doRest">DESCANSAR</button>',()=>$('#doRest').onclick=()=>{close();rest()});return}let opp=upcoming();match={opp,events:[{type:'pass',zone:0,done:false},{type:'shot',zone:1,done:false},{type:'pass',zone:2,done:false},{type:'shot',zone:3,done:false}],idx:0,home:0,away:0,contrib:0,passes:0,shots:0};tab='Partida';render()}function fieldSVG(){return `<canvas id="pitch" width="420" height="520" aria-label="Campo de futebol interativo"></canvas>`}function renderMatch(){nav.innerHTML='';let e=match.events[match.idx];app.innerHTML=`<header class="head"><div><div class="brand">DIA DE JOGO</div><div class="season">${esc(G.club)} × ${esc(match.opp)} · LANCE ${match.idx+1}/4</div></div><span class="badge">${esc(G.player)} · ${G.energy}% ⚡</span></header><section class="card" style="padding:11px"><div class="fixture" style="padding:0"><div class="club">${esc(G.club)}</div><div class="versus" style="font-size:22px;color:var(--ink)">${match.home} : ${match.away}</div><div class="club">${esc(match.opp)}</div></div><div class="meta"><span>MINUTO ${[18,36,59,78][match.idx]}'</span><span>${e.type==='p function bindField(){let cv=$('#pitch');function point(ev){let r=cv.getBoundingClientRect();return{x:(ev.clientX-r.left)*420/r.width,y:(ev.clientY-r.top)*520/r.height}}cv.onpointerdown=e=>{if(!$('#continue').classList.contains('hidden'))return;let p=point(e),ev=match.events[match.idx];if(ev.type==='pass'){if(p.y<435){handlePass(p.x,p.y);return}$('#msg').textContent='Toque em um dos companheiros no campo para passar.';return}if(Math.hypot(p.x-ball.x,p.y-ball.y)<90){drag=p;cv.setPointerCapture(e.pointerId);drawField()}};cv.onpointermove=e=>{if(drag){drag=point(e);drawField()}};cv.onpointerup=e=>{if(!drag)return;let end=point(e),dx=end.x-ball.x,dy=end.y-ball.y;drag=null;drawField();if(dy>0||Math.hypot(dx,dy)<25){$('#msg').textContent='Arraste da bola para cima, em direção ao gol.';return}handleShot(dx,dy)};cv.onpointercancel=()=>{drag=null;drawField()}}
render();
})();
</script></body></html>
