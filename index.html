om()*100+G.pass*.55+G.control*.25+G.energy*.08;let success=score+quality*12>76;match.passes++;if(success){match.contrib++;G.assists++;$('#msg').textContent='Passe preciso! A equipe avança e cria uma boa chance.';ev.done=true;advance(false)}else{$('#msg').textContent='A defesa interceptou. O time recuperou a bola e segue no jogo.';advance(false)}}function handleShot(dx,dy){let ev=match.events[match.idx];if(ev.type!=='shot')return;let aim=Math.atan2(dx,-dy);let angle=Math.abs(aim);let force=Math.min(1,Math.hypot(dx,dy)/230);let center=angle<.38;let score=Math.random()*100+G.shoot*.72+G.control*.12+G.energy*.08;let goal=center&&force>.17&&score>48;match.shots++;if(goal){match.home++;G.goals++;match.contrib++;$('#msg').textContent='GOOOOL! Chute colocado no canto, sem chance para o goleiro.'}else if(!center){$('#msg').textContent='A bola passou ao lado! Tente mirar mais perto do centro do gol.'}else{$('#msg').textContent='O goleiro defendeu! Uma boa tentativa, mas faltou precisão.'}advance(false)}function advance(last){G.energy=Math.max(0,G.energy-4);persist();let btn=$('#continue');btn.classList.remove('hidden');btn.textContent=match.idx>=3?'VER RESULTADO →':'PRÓXIMO LANCE →';btn.onclick=()=>{match.idx++;if(match.idx>=4)finishMatch();else renderMatch()}}function finishMatch(){let oppGoals=Math.max(0,Math.min(3,Math.floor(Math.random()*3)));match.away=oppGoals;let home=match.home;let result=home>oppGoals?'vitória':home===oppGoals?'empate':'derrota';if(home>oppGoals){applyResult(G.club,match.opp,home,oppGoals)}else applyResult(match.opp,G.club,oppGoals,home);G.apps++;G.energy=Math.max(0,G.energy-5);G.morale=Math.max(30,Math.min(99,G.morale+(result==='vitória'?5:result==='empate'?1:-4)));let perf=match.contrib;G.shoot=Math.min(90,G.shoot+(match.shots&&home?1:0));if(perf)G.pass=Math.min(90,G.pass+1);G.control=Math.min(90,G.control+(perf?1:0));G.stars+=perf;G.lastResult=`${home}–${oppGoals} ${result} contra ${match.opp}`;record(`${G.lastResult}. ${perf} lance${perf===1?'':'
